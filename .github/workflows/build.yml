name: Build Fedora akmod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: registry.fedoraproject.org/fedora:45
    steps:
      - name: Install build dependencies
        run: dnf -y install git akmods kmodtool rpm-build gcc make elfutils-libelf-devel kernel-devel
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build RPMs
        run: make rpm
      - name: Build against Fedora's available kernel headers
        run: |
          kernel_release=$(find /usr/src/kernels -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          test -n "$kernel_release"
          mkdir -p .build/kernel
          akmodsbuild --kernels "$kernel_release" --outputdir "$PWD/.build/kernel" .build/rpmbuild/SRPMS/*.src.rpm
